name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            llvm: linux-x86_64
          - runner: macos-latest
            llvm: macos-arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      GRIMACE_REF: 712288e
      GRIMACE_LLVM_RELEASE: v5
    steps:
      - uses: actions/checkout@v7

      - name: Install CMake and Ninja
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build
          else
            brew install ninja
          fi

      - name: Check out grimace
        run: |
          git clone https://github.com/grimace-sdk/grimace.git "$RUNNER_TEMP/grimace"
          git -C "$RUNNER_TEMP/grimace" checkout "$GRIMACE_REF"
          echo "GRIMACE=$RUNNER_TEMP/grimace" >> "$GITHUB_ENV"

      - name: Download the Windows CE LLVM
        run: |
          name=llvm-$GRIMACE_LLVM_RELEASE-${{ matrix.llvm }}
          url=https://github.com/grimace-sdk/llvm-builds/releases/download/$GRIMACE_LLVM_RELEASE
          curl -fsSLO $url/$name.tar.xz
          curl -fsSLO $url/$name.tar.xz.sha256
          shasum -a 256 -c $name.tar.xz.sha256
          tar xf $name.tar.xz -C "$RUNNER_TEMP"
          echo "GRIMACE_LLVM_ROOT=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"

      - name: Fetch and patch the sources
        run: tools/fetch-sources.sh

      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$GRIMACE/cmake/toolchain.cmake" \
              -DGRIMACE_ARCH=arm -DGRIMACE_CE_VERSION=6 -DGRIMACE_PLATFORM=brain
          cmake --build build

      - name: Check imports
        run: |
          python3 "$GRIMACE/tests/check-imports.py" --arch arm --version 6 --platform brain build | tee imports.log
          grep -q ", 0 problems" imports.log

      - name: Upload SDL3.dll and the examples
        uses: actions/upload-artifact@v7
        with:
          name: brain-sdl-${{ matrix.llvm }}
          path: |
            build/SDL3.dll
            build/examples/*.exe
